<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Opłaty"><meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Opłaty Stałe</title>
<style>
:root{--bg:#0b0e14;--s:#141923;--s2:#1b2230;--b:#262f42;--t:#eef2f8;--t2:#9aa7bd;--ac:#5aa9ff;--g:#2dd4a0;--r:#ff5c7a;--y:#fbbf24;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--s:#fff;--s2:#eef1f6;--b:#d9dfea;--t:#121826;--t2:#5b677d;--ac:#1f6feb;--g:#0f9d74;--r:#d6264a;--y:#b7791f;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b)}
h1{font-size:22px}.mu{color:var(--t2);font-size:12px}
main{max-width:820px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--s);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:9px 0 7px;background:none;border:0;color:var(--t2);font-size:11px}nav button.on{color:var(--ac);font-weight:700}nav b{display:block;font-size:20px;font-weight:400}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;background:var(--ac);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 6px 20px #0006}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--b)}.card h2+.row,.card>.row:first-child{border-top:0}
.n{flex:1;min-width:0}.n>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;white-space:nowrap}
.up{color:var(--r)}.dn{color:var(--g)}
.chip{border:1px solid var(--b);background:var(--s2);color:var(--t2);border-radius:20px;padding:5px 11px;font-size:12px;white-space:nowrap}
.chip.paid,.chip.ok{color:var(--g);border-color:var(--g)}.chip.unpaid,.chip.err{color:var(--r);border-color:var(--r)}.chip.partial,.chip.dirty{color:var(--y);border-color:var(--y)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600}.btn.g{background:var(--s2);color:var(--t);border:1px solid var(--b)}
.gh{display:flex;justify-content:space-between;margin:16px 4px 6px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.bar{height:5px;border-radius:3px;background:var(--s2);margin-top:5px}.bar i{display:block;height:100%;border-radius:3px}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.seg button{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--b);background:var(--s);color:var(--t2);font-weight:700;font-size:13px;white-space:nowrap}.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}
.sh{background:var(--s);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
input,select{width:100%;background:var(--s2);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:11px;font-size:16px}
input[type=checkbox]{width:22px;height:22px}
label{display:block;font-size:12px;color:var(--t2);margin:12px 0 4px}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fl .btn{flex:1}
.hint{font-size:11px;color:var(--t2);margin-top:4px}
.mxw{overflow-x:auto;margin:0 -14px;padding:0 14px}.mx{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.mx th,.mx td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--b)}.mx th{color:var(--t2);font-weight:600}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:var(--s);text-align:left;max-width:130px;overflow:hidden;text-overflow:ellipsis;z-index:1}
.mx td.c{cursor:pointer}.mx td.z{color:var(--b)}.mx tr.t td{font-weight:800;border-top:2px solid var(--b)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:var(--t);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:30;display:none}
</style></head><body>
<header><div><h1 id="ttl"></h1><div class="mu" id="sub"></div></div><button class="chip" id="sv" data-a="sync"></button></header>
<main id="app"></main>
<button class="fab" id="fab" data-a="new">＋ Wpis</button>
<nav><button data-a="tab" data-t="home"><b>◉</b>Dziś</button><button data-a="tab" data-t="month"><b>▤</b>Wpisy</button><button data-a="tab" data-t="an"><b>▥</b>Analiza</button><button data-a="tab" data-t="set"><b>⚙</b>Ustawienia</button></nav>
<div id="sheet"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const MN=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'],MNS=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const SL={paid:'Opłacone',unpaid:'Do zapłaty',partial:'Częściowo',na:'—'};
const BG={itb:['ITB','#60a5fa'],dti:['DTI','#e879f9'],auto:['Auto','#fb923c'],media:['Media','#34d399'],osobiste:['Osobiste','#fbbf24'],inne:['Inne','#94a3b8']};
let S,dir=null,tab='home',sub='przeglad',dirty=false,lastSave=localStorage.ls||'';
const nowYM=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)};
let ym=nowYM(),yr=+ym.slice(0,4);
const addM=(m,n)=>{let[y,k]=m.split('-').map(Number);k=k-1+n;y+=Math.floor(k/12);k=((k%12)+12)%12;return y+'-'+pad(k+1)};
const rng=(a,b)=>{const o=[];for(let m=a;m<=b;m=addM(m,1))o.push(m);return o};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const f0=n=>Math.round(n).toLocaleString('pl-PL')+' zł',f2=n=>n.toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł';
const ml=m=>{const[y,k]=m.split('-');return MN[k-1]+' '+y};
const dlt=(a,b)=>{const d=a-b;if(!b)return d?'<span class="mu">nowe</span>':'';if(Math.abs(d)<.5)return'<span class="mu">±0%</span>';return`<span class="${d>0?'up':'dn'}">${d>0?'+':''}${(d/Math.abs(b)*100).toFixed(0)}%</span>`};
/* ══ pamięć i pliki (ta sama baza co poprzednie wersje) ══ */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('oplaty_stale_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>res(r.result);r.onerror=rej});
async function gk(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('state').objectStore('state').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
async function pk(k,v){try{const d=await idb();return await new Promise(r=>{const t=d.transaction('state','readwrite');t.objectStore('state').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()})}catch(e){}}
function norm(){S.settings=S.settings||{};S.budgets=S.budgets||{};gistMigrate()}
async function init(){
 S=await gk('main');if(!S||!S.categories){try{S=JSON.parse(localStorage.os_v2)}catch(e){}}
 if(!S||!S.categories)S={categories:{},profiles:{},settings:{},budgets:{},households:{},_version:3};
 norm();dir=(await gk('dir'))||null;navigator.storage?.persist?.();gistStartup();render()}
function save(){dirty=true;pk('main',S);clearTimeout(save.t);if(dir)save.t=setTimeout(()=>writeDir(true),1500);gistOnSave();hdr()}
function stamp(){dirty=false;lastSave=new Date().toLocaleString('pl-PL');localStorage.ls=lastSave;hdr()}
async function writeDir(q){try{const o={mode:'readwrite'};if(await dir.queryPermission(o)!=='granted'&&await dir.requestPermission(o)!=='granted')throw 0;
 const w=await(await dir.getFileHandle('oplaty_stale.json',{create:true})).createWritable();await w.write(JSON.stringify(S));await w.close();stamp();if(!q)toast('Zapisano w folderze ✓')}catch(e){if(!q)toast('Brak dostępu do folderu')}}
async function exportFile(){
 if(dir)return writeDir();
 const f=new File([JSON.stringify(S)],'oplaty_stale.json',{type:'application/json'});
 if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f]});stamp();return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();stamp();toast('Plik pobrany — zapisz go w Pliki → iCloud Drive')}
function applyData(t){try{const d=JSON.parse(t);if(!d.categories)throw 0;if(!confirm('Zastąpić dane w aplikacji danymi z pliku?'))return;S=d;norm();save();render();toast('Wczytano ✓')}catch(e){toast('Nieprawidłowy plik')}}
function loadFile(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>i.files[0]&&i.files[0].text().then(applyData);i.click()}
async function loadDir(){try{applyData(await(await(await dir.getFileHandle('oplaty_stale.json')).getFile()).text())}catch(e){toast('Nie znaleziono pliku w folderze')}}
async function connectDir(){try{dir=await showDirectoryPicker({mode:'readwrite'});await pk('dir',dir);await writeDir();render()}catch(e){}}
async function dropDir(){dir=null;await pk('dir',null);render()}
/* ══ Gist (token tylko lokalnie, wykrywanie konfliktów) ══ */
const GF='oplaty_stale.json',GA='https://api.github.com/gists',K_T='gist_token_bk2',K_I='gist_id_bk2',K_R='gist_rev',K_D='gist_dirty',K_A='gist_auto',K_L='gist_last';
const lsg=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},lss=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
const gT=()=>lsg(K_T),gI=()=>lsg(K_I),gAuto=()=>lsg(K_A)!=='0',gOn=()=>!!(gT()&&gI());
function gistMigrate(){const s=S.settings;if(s.gistToken){if(!lsg(K_T))lss(K_T,s.gistToken);delete s.gistToken}if(s.gistId){if(!lsg(K_I))lss(K_I,s.gistId);delete s.gistId}if(s.gistAutoSync!==undefined){if(!lsg(K_A))lss(K_A,s.gistAutoSync?'1':'0');delete s.gistAutoSync}delete s.gistLastSync}
const gH=()=>({'Authorization':'token '+gT(),'Accept':'application/vnd.github+json'});
async function gGet(){const r=await fetch(GA+'/'+gI(),{headers:gH(),cache:'no-store'});if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error('HTTP '+r.status+(m?': '+m:''))}return r.json()}
async function gBody(d){const f=d.files&&d.files[GF];if(!f)throw new Error('Brak pliku '+GF+' w Gist');if(f.truncated&&f.raw_url)return(await fetch(f.raw_url,{headers:gH()})).text();return f.content}
function gChip(s){gChip.s=s;hdr()}
async function gistPull(o){o=o||{};
 if(!gOn()){if(!o.silent){toast('Podaj token i Gist ID w Ustawieniach');tab='set';render()}return false}
 if(o.ask&&!confirm('Zastąpić dane na tym urządzeniu danymi z Gista?'))return false;
 gChip('busy');
 try{const d=await gGet(),rev=d.updated_at,known=lsg(K_R),dr=lsg(K_D)==='1';
  if(!o.force){
   if(known===rev){gChip(dr?'dirty':'ok');return true}
   if(dr&&!confirm('KONFLIKT: na Gist są nowsze dane, a tu masz niewysłane zmiany.\n\nOK = wczytaj z Gista (lokalne zmiany przepadną)\nAnuluj = zostaw lokalne'))return gChip('conflict'),false;
   if(!known&&!dr&&Object.keys(S.categories||{}).length&&!confirm('To urządzenie nie było jeszcze zsynchronizowane. Wczytać dane z Gista i zastąpić lokalne?'))return gChip('dirty'),false}
  const p=JSON.parse(await gBody(d));if(!p.categories)throw new Error('Nieprawidłowe dane w Gist');
  S=p;norm();lss(K_R,rev);lss(K_D,'');lss(K_L,String(Date.now()));pk('main',S);gChip('ok');render();if(!o.silent)toast('Wczytano z Gist ✓');return true
 }catch(e){gChip('err');if(!o.silent)toast('Błąd Gist: '+e.message);return false}}
async function gistPush(o){o=o||{};
 if(!gT()){if(!o.auto){toast('Podaj token GitHub w Ustawieniach');tab='set';render()}return}
 if(gistPush.b)return;gistPush.b=1;gChip('busy');
 try{const id=gI(),known=lsg(K_R);
  if(id){const d=await gGet();if(d.updated_at!==known){
   if(o.auto){gChip('conflict');return}
   if(!confirm(known?'Na Gist są zmiany z innego urządzenia, których tu nie masz.\n\nOK = nadpisz Gist moimi danymi\nAnuluj = przerwij (użyj „Pobierz z Gist”)':'Ten Gist ma już dane, a to urządzenie jeszcze się z nim nie zsynchronizowało.\n\nOK = nadpisz Gist danymi stąd\nAnuluj = przerwij')){gChip('dirty');return}}}
  const r=await fetch(id?GA+'/'+id:GA,{method:id?'PATCH':'POST',headers:Object.assign(gH(),{'Content-Type':'application/json'}),body:JSON.stringify({description:'Opłaty Stałe – dane',public:false,files:{[GF]:{content:JSON.stringify(S)}}})});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error('HTTP '+r.status+(m?': '+m:''))}
  const d2=await r.json();if(!id&&d2.id)lss(K_I,d2.id);lss(K_R,d2.updated_at);lss(K_D,'');lss(K_L,String(Date.now()));gChip('ok');if(!o.auto)toast('Zapisano w Gist ✓')
 }catch(e){gChip('err');if(!o.auto)toast('Błąd Gist: '+e.message)}finally{gistPush.b=0}}
const gistSync=()=>lsg(K_D)==='1'?gistPush():gistPull();
function gistOnSave(){lss(K_D,'1');if(gOn()){gChip('dirty');if(gAuto()){clearTimeout(gistOnSave.t);gistOnSave.t=setTimeout(()=>gistPush({auto:true}),4000)}}}
function gistSaveCfg(){const t=$('#gt').value.trim();if(t)lss(K_T,t);lss(K_I,$('#gi').value.trim());lss(K_A,$('#ga').checked?'1':'0');toast('Zapisano ustawienia Gist ✓');hdr()}
function gistLink(){if(!gOn())return toast('Najpierw podaj token i Gist ID');const u=location.origin+location.pathname+'#gist='+encodeURIComponent(gI())+'&t='+encodeURIComponent(gT());
 if(navigator.share)navigator.share({title:'Opłaty Stałe – konfiguracja',url:u}).catch(()=>{});else navigator.clipboard?.writeText(u).then(()=>toast('Link skopiowany. Zawiera token — nie przekazuj go dalej!'))}
function gistStartup(){const h=location.hash,fresh=/gist=/.test(h);
 if(fresh){const p=new URLSearchParams(h.slice(1));if(p.get('gist')&&p.get('t')){lss(K_I,p.get('gist'));lss(K_T,p.get('t'));lss(K_A,'1');lss(K_R,'');history.replaceState(null,'',location.pathname+location.search)}}
 if(gOn())setTimeout(()=>gistPull({silent:!fresh}),800);
 let last=0;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&gOn()&&Date.now()-last>20000){last=Date.now();gistPull({silent:true})}});
 addEventListener('online',()=>{if(lsg(K_D)==='1')gistPush({auto:true})})}
/* ══ model danych ══ */
const cats=()=>Object.entries(S.categories).filter(([n,c])=>!c.hidden);
const lim=()=>S.settings.excl?+(S.settings.thr||10000):Infinity;
const v=(c,m)=>{const x=c.values?.[m];return x>=lim()?0:(x||0)};
const tot=m=>cats().reduce((s,[n,c])=>s+v(c,m),0),totS=ms=>ms.reduce((s,m)=>s+tot(m),0),sumR=(c,ms)=>ms.reduce((s,m)=>s+v(c,m),0);
function groups(){const o={};for(const k in BG)o[k]={label:BG[k][0],color:BG[k][1]};const sg=S.settings.groups||{};for(const k in sg)o[k]={label:sg[k].label||k,color:sg[k].color||'#94a3b8'};(S.settings.deletedGroups||[]).forEach(k=>{if(k!=='inne')delete o[k]});return o}
const gi=t=>groups()[t]||{label:t||'Inne',color:'#94a3b8'};
const dotg=t=>`<span class="dot" style="background:${gi(t).color}"></span>`;
function missing(m){const p=addM(m,-1),p2=addM(m,-2);return cats().filter(([n,c])=>c.values?.[m]==null&&c.values?.[p]>0&&c.values?.[p2]>0).map(([n,c])=>[n,c.values[p]])}
function per(y){const k=y===+nowYM().slice(0,4)?+nowYM().slice(5):12,a=rng(y+'-01',y+'-'+pad(k));return[a,a.map(m=>addM(m,-12)),k]}
function bars(a,cur){const mx=Math.max(...a.map(x=>x.v),1),w=300/a.length;return`<svg viewBox="0 0 300 120" width="100%">`+a.map((x,i)=>{const h=Math.max(1,Math.max(0,x.v)/mx*88);return`<rect x="${i*w+2}" y="${96-h}" width="${w-4}" height="${h}" rx="3" fill="${x.k===cur?'var(--ac)':'var(--b)'}"/><text x="${i*w+w/2}" y="112" font-size="9" text-anchor="middle" fill="var(--t2)">${x.l}</text>`}).join('')+`</svg>`}
function spark(c){const a=rng(addM(nowYM(),-11),nowYM()).map(m=>v(c,m)),mx=Math.max(...a,1);return`<svg viewBox="0 0 60 18" width="60" height="18"><polyline fill="none" stroke="var(--ac)" stroke-width="1.5" points="${a.map((x,i)=>(i*60/11).toFixed(1)+','+(16-x/mx*14).toFixed(1)).join(' ')}"/></svg>`}
function gtab(y){const[a,b]=per(y),G={};cats().forEach(([n,c])=>{const t=c.tag||'inne';G[t]=G[t]||[0,0];G[t][0]+=sumR(c,a);G[t][1]+=sumR(c,b)});
 const R=Object.entries(G).filter(r=>r[1][0]||r[1][1]).sort((p,q)=>q[1][0]-p[1][0]),mx=Math.max(...R.map(r=>r[1][0]),1);
 return R.map(([t,[x,z]])=>`<div class="row"><div class="n"><div>${dotg(t)}${esc(gi(t).label)}</div><div class="bar"><i style="width:${Math.max(0,x)/mx*100}%;background:${gi(t).color}"></i></div></div><div><div class="num">${f0(x)}</div><div class="mu" style="text-align:right">rok temu ${f0(z)} ${dlt(x,z)}</div></div></div>`).join('')}
/* ══ DZIŚ ══ */
function home(){
 const cur=nowYM(),L=cats(),T=tot(cur),avg=totS(rng(addM(cur,-12),addM(cur,-1)))/12,ms=missing(cur);
 if(!L.length)return`<div class="card"><h2>Zaczynamy</h2><p>Brak danych w tej przeglądarce. Wczytaj plik <b>oplaty_stale.json</b> (iCloud / Pliki), pobierz dane z Gista w Ustawieniach albo dodaj pierwszy wpis.</p><div class="fl" style="margin-top:12px"><button class="btn" data-a="load">Wczytaj plik</button></div></div>`;
 let pd=0,up=0,nu=0,ov=0;L.forEach(([n,c])=>{const x=v(c,cur),s=c.statuses?.[cur];if(!x)return;if(s==='paid')pd+=x;else if(s==='unpaid'||s==='partial'){up+=x;nu++}const l=S.budgets[n];if(l&&x>l)ov++});
 let h=`<div class="card"><div class="mu">${ml(cur)}</div><div class="big">${f2(T)}</div><div class="mu">średnia z 12 mies.: ${f0(avg)} ${dlt(T,avg)}</div><div style="margin-top:8px"><span class="dn">opłacone ${f0(pd)}</span> · <span class="up">do zapłaty ${f0(up)}</span></div></div>`;

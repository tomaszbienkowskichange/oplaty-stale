<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Opłaty"><meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<title>Opłaty Stałe</title>
<style>
:root{--bg:#0b0e14;--s:#141923;--s2:#1b2230;--b:#262f42;--t:#eef2f8;--t2:#9aa7bd;--ac:#5aa9ff;--g:#2dd4a0;--r:#ff5c7a;--y:#fbbf24;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--s:#fff;--s2:#eef1f6;--b:#d9dfea;--t:#121826;--t2:#5b677d;--ac:#1f6feb;--g:#0f9d74;--r:#d6264a;--y:#b7791f;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--b)}
h1{font-size:22px}.mu{color:var(--t2);font-size:12px}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(150px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--s);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:9px 0 7px;background:none;border:0;color:var(--t2);font-size:11px}nav button.on{color:var(--ac);font-weight:700}nav b{display:block;font-size:20px;font-weight:400}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:7;background:var(--ac);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 6px 20px #0006}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--b)}.card h2+.row,.card>.row:first-child{border-top:0}
.n{flex:1;min-width:0}.n>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.up{color:var(--r)}.dn{color:var(--g)}
.chip{border:1px solid var(--b);background:var(--s2);color:var(--t2);border-radius:20px;padding:5px 11px;font-size:12px;white-space:nowrap}
.chip.paid{color:var(--g);border-color:var(--g)}.chip.unpaid{color:var(--r);border-color:var(--r)}.chip.partial{color:var(--y);border-color:var(--y)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:600}.btn.g{background:var(--s2);color:var(--t);border:1px solid var(--b)}
.gh{display:flex;justify-content:space-between;margin:16px 4px 6px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.bar{height:5px;border-radius:3px;background:var(--s2);margin-top:5px}.bar i{display:block;height:100%;border-radius:3px}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end}
.sh{background:var(--s);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
input,select{width:100%;background:var(--s2);color:var(--t);border:1px solid var(--b);border-radius:10px;padding:11px;font-size:16px}
label{display:block;font-size:12px;color:var(--t2);margin:12px 0 4px}
.fl{display:flex;gap:8px;flex-wrap:wrap}.fl .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);background:var(--t);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:30;display:none}
</style></head><body>
<header><div><h1 id="ttl"></h1><div class="mu" id="sub"></div></div><button class="chip" id="sv" data-a="tab" data-t="data"></button></header>
<main id="app"></main>
<button class="fab" data-a="new">＋ Wpis</button>
<nav><button data-a="tab" data-t="home"><b>◉</b>Start</button><button data-a="tab" data-t="month"><b>▤</b>Miesiąc</button><button data-a="tab" data-t="an"><b>▥</b>Analizy</button><button data-a="tab" data-t="data"><b>⚙</b>Dane</button></nav>
<div id="sheet"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const MN=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'],MNS=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const SL={paid:'Opłacone',unpaid:'Do zapłaty',partial:'Częściowo',na:'—'};
const BG={itb:['ITB','#60a5fa'],dti:['DTI','#e879f9'],auto:['Auto','#fb923c'],media:['Media','#34d399'],osobiste:['Osobiste','#fbbf24'],inne:['Inne','#94a3b8']};
let S,dir=null,tab='home',dirty=false,lastSave=localStorage.ls||'';
const nowYM=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)};
let ym=nowYM(),yr=+ym.slice(0,4);
const addM=(m,n)=>{let[y,k]=m.split('-').map(Number);k=k-1+n;y+=Math.floor(k/12);k=((k%12)+12)%12;return y+'-'+pad(k+1)};
const rng=(a,b)=>{const o=[];for(let m=a;m<=b;m=addM(m,1))o.push(m);return o};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const f0=n=>Math.round(n).toLocaleString('pl-PL')+' zł',f2=n=>n.toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł';
const ml=m=>{const[y,k]=m.split('-');return MN[k-1]+' '+y};
const dlt=(a,b)=>{const d=a-b;if(!b)return d?'<span class="mu">nowe</span>':'';if(Math.abs(d)<.5)return'<span class="mu">±0%</span>';return`<span class="${d>0?'up':'dn'}">${d>0?'+':''}${(d/Math.abs(b)*100).toFixed(0)}%</span>`};
/* ── storage (ta sama baza co stara wersja → dane zostaną wczytane) ── */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('oplaty_stale_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('state');r.onsuccess=()=>res(r.result);r.onerror=rej});
async function gk(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('state').objectStore('state').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
async function pk(k,v){try{const d=await idb();return await new Promise(r=>{const t=d.transaction('state','readwrite');t.objectStore('state').put(v,k);t.oncomplete=()=>r();t.onerror=()=>r()})}catch(e){}}
async function init(){
 S=await gk('main');
 if(!S||!S.categories){try{S=JSON.parse(localStorage.os_v2)}catch(e){}}
 if(!S||!S.categories)S={categories:{},profiles:{},settings:{},budgets:{},households:{},_version:3};
 S.settings=S.settings||{};dir=(await gk('dir'))||null;
 navigator.storage?.persist?.();render()}
function save(){dirty=true;pk('main',S);clearTimeout(save.t);if(dir)save.t=setTimeout(()=>writeDir(true),1500);hdr()}
function stamp(){dirty=false;lastSave=new Date().toLocaleString('pl-PL');localStorage.ls=lastSave;hdr()}
async function writeDir(q){try{const o={mode:'readwrite'};if(await dir.queryPermission(o)!=='granted'&&await dir.requestPermission(o)!=='granted')throw 0;
 const w=await(await dir.getFileHandle('oplaty_stale.json',{create:true})).createWritable();await w.write(JSON.stringify(S));await w.close();stamp();if(!q)toast('Zapisano w folderze ✓')}catch(e){if(!q)toast('Brak dostępu do folderu')}}
async function exportFile(){
 if(dir)return writeDir();
 const f=new File([JSON.stringify(S)],'oplaty_stale.json',{type:'application/json'});
 if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f]});stamp();return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();stamp();toast('Plik pobrany — zapisz go w Pliki → iCloud Drive')}
function applyData(t){try{const d=JSON.parse(t);if(!d.categories)throw 0;if(!confirm('Zastąpić dane w aplikacji danymi z pliku?'))return;S=d;S.settings=S.settings||{};save();render();toast('Wczytano ✓')}catch(e){toast('Nieprawidłowy plik')}}
function loadFile(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>i.files[0]&&i.files[0].text().then(applyData);i.click()}
async function loadDir(){try{applyData(await(await(await dir.getFileHandle('oplaty_stale.json')).getFile()).text())}catch(e){toast('Nie znaleziono pliku w folderze')}}
async function connectDir(){try{dir=await showDirectoryPicker({mode:'readwrite'});await pk('dir',dir);await writeDir();render()}catch(e){}}
async function dropDir(){dir=null;await pk('dir',null);render()}
/* ── dane ── */
const cats=()=>Object.entries(S.categories).filter(([n,c])=>!c.hidden);
const lim=()=>S.settings.excl?+(S.settings.thr||10000):Infinity;
const v=(c,m)=>{const x=c.values?.[m];return x>=lim()?0:(x||0)};
const tot=m=>cats().reduce((s,[n,c])=>s+v(c,m),0),totS=ms=>ms.reduce((s,m)=>s+tot(m),0),sumR=(c,ms)=>ms.reduce((s,m)=>s+v(c,m),0);
function groups(){const o={};for(const k in BG)o[k]={label:BG[k][0],color:BG[k][1]};const sg=S.settings.groups||{};for(const k in sg)o[k]={label:sg[k].label||k,color:sg[k].color||'#94a3b8'};(S.settings.deletedGroups||[]).forEach(k=>{if(k!=='inne')delete o[k]});return o}
const gi=t=>groups()[t]||{label:t||'Inne',color:'#94a3b8'};
function missing(m){const p=addM(m,-1),p2=addM(m,-2);return cats().filter(([n,c])=>c.values?.[m]==null&&!(c.contractEnd&&c.contractEnd.slice(0,7)<m)&&c.values?.[p]>0&&c.values?.[p2]>0).map(([n,c])=>[n,c.values[p]])}
function per(y){const k=y===+nowYM().slice(0,4)?+nowYM().slice(5):12,a=rng(y+'-01',y+'-'+pad(k));return[a,a.map(m=>addM(m,-12)),k]}
function bars(a,cur){const mx=Math.max(...a.map(x=>x.v),1),w=300/a.length;return`<svg viewBox="0 0 300 120" width="100%">`+a.map((x,i)=>{const h=Math.max(1,Math.max(0,x.v)/mx*88);return`<rect x="${i*w+2}" y="${96-h}" width="${w-4}" height="${h}" rx="3" fill="${x.k===cur?'var(--ac)':'var(--b)'}"/><text x="${i*w+w/2}" y="112" font-size="9" text-anchor="middle" fill="var(--t2)">${x.l}</text>`}).join('')+`</svg>`}
function gtab(y){const[a,b]=per(y),G={};cats().forEach(([n,c])=>{const t=c.tag||'inne';G[t]=G[t]||[0,0];G[t][0]+=sumR(c,a);G[t][1]+=sumR(c,b)});
 const R=Object.entries(G).filter(r=>r[1][0]||r[1][1]).sort((p,q)=>q[1][0]-p[1][0]),mx=Math.max(...R.map(r=>r[1][0]),1);
 return R.map(([t,[x,z]])=>`<div class="row"><div class="n"><div><span class="dot" style="background:${gi(t).color}"></span>${esc(gi(t).label)}</div><div class="bar"><i style="width:${Math.max(0,x)/mx*100}%;background:${gi(t).color}"></i></div></div><div><div class="num">${f0(x)}</div><div class="mu" style="text-align:right">rok temu ${f0(z)} ${dlt(x,z)}</div></div></div>`).join('')}
/* ── widoki ── */
function home(){
 const cur=nowYM(),L=cats(),T=tot(cur),avg=totS(rng(addM(cur,-12),addM(cur,-1)))/12,ms=missing(cur);
 if(!L.length)return`<div class="card"><h2>Zaczynamy</h2><p>Brak danych w tej przeglądarce. Wczytaj swój plik <b>oplaty_stale.json</b> (iCloud / Pliki) albo dodaj pierwszy wpis przyciskiem „＋ Wpis”.</p><div class="fl" style="margin-top:12px"><button class="btn" data-a="load">Wczytaj plik</button></div></div>`;
 let pd=0,up=0,nu=0;L.forEach(([n,c])=>{const x=v(c,cur),s=c.statuses?.[cur];if(!x)return;if(s==='paid')pd+=x;else if(s==='unpaid'||s==='partial'){up+=x;nu++}});
 const ce=L.filter(([n,c])=>{if(!c.contractEnd)return;const d=(new Date(c.contractEnd)-Date.now())/864e5;return d>=0&&d<=90});
 let h=`<div class="card"><div class="mu">${ml(cur)}</div><div class="big">${f2(T)}</div><div class="mu">średnia z 12 mies.: ${f0(avg)} ${dlt(T,avg)}</div><div style="margin-top:8px"><span class="dn">opłacone ${f0(pd)}</span> · <span class="up">do zapłaty ${f0(up)}</span></div></div>`;
 h+=`<div class="card"><h2>Do zrobienia</h2>`+(ms.length?`<div class="row" data-a="tab" data-t="month"><div class="n"><div><b>${ms.length}</b> stałych opłat bez wpisu</div><div class="mu">były w 2 poprzednich miesiącach</div></div><span class="chip">Uzupełnij ›</span></div>`:'')+(nu?`<div class="row" data-a="tab" data-t="month"><div class="n"><div><b>${nu}</b> pozycji do zapłaty</div></div><span class="chip unpaid">${f0(up)}</span></div>`:'')+(!ms.length&&!nu?`<div class="row dn">✓ Wszystko uzupełnione</div>`:'')+ce.map(([n,c])=>`<div class="row"><div class="n"><div>Umowa: ${esc(n)}</div><div class="mu">kończy się ${c.contractEnd}</div></div><span class="chip partial">≤ 90 dni</span></div>`).join('')+`</div>`;
 h+=`<div class="card"><h2>Ostatnie 12 miesięcy</h2>${bars(rng(addM(cur,-11),cur).map(m=>({k:m,l:MNS[+m.slice(5)-1],v:tot(m)})),cur)}</div>`;
 const[,,k]=per(yr);return h+`<div class="card"><h2>Grupy · ${MNS[0]}–${MNS[k-1]} ${+cur.slice(0,4)} vs rok temu</h2>${gtab(+cur.slice(0,4))}</div>`}
function month(){
 const L=cats(),T=tot(ym),sumG=l=>l.reduce((s,[n,c])=>s+v(c,ym),0);let pd=0,up=0,cnt=0;
 L.forEach(([n,c])=>{const x=v(c,ym);if(!x)return;cnt++;const s=c.statuses?.[ym];if(s==='paid')pd+=x;else if(s==='unpaid'||s==='partial')up+=x});
 const ms=missing(ym);
 let h=`<div class="mn"><button class="btn g" data-a="mv" data-d="-1">‹</button><b style="font-size:18px">${ml(ym)}</b><button class="btn g" data-a="mv" data-d="1">›</button></div><div class="card"><div class="mu">Suma miesiąca · ${cnt} pozycji</div><div class="big">${f2(T)}</div><div class="mu"><span class="dn">opłacone ${f0(pd)}</span> · <span class="up">do zapłaty ${f0(up)}</span></div></div>`;
 if(ms.length)h+=`<div class="card"><h2>Brak wpisu — dotknij, aby dodać</h2>${ms.map(([n,a])=>`<div class="row" data-a="edit" data-n="${esc(n)}" data-m="${ym}"><div class="n"><div>${esc(n)}</div><div class="mu">poprzednio ${f2(a)}</div></div><span class="chip">＋ dodaj</span></div>`).join('')}</div>`;
 const bt={};L.forEach(([n,c])=>{if(c.values?.[ym]!=null)(bt[c.tag||'inne']=bt[c.tag||'inne']||[]).push([n,c])});
 Object.entries(bt).sort((p,q)=>sumG(q[1])-sumG(p[1])).forEach(([t,l])=>{h+=`<div class="gh"><span><span class="dot" style="background:${gi(t).color}"></span>${esc(gi(t).label)}</span><span>${f0(sumG(l))}</span></div><div class="card" style="padding:2px 14px">`+l.sort((p,q)=>q[1].values[ym]-p[1].values[ym]).map(([n,c])=>{const s=c.statuses?.[ym]||'na';return`<div class="row" data-a="edit" data-n="${esc(n)}" data-m="${ym}"><div class="n"><div>${esc(n)}</div>${c.notes?.[ym]?`<div class="mu">${esc(c.notes[ym])}</div>`:''}</div><div class="num">${f2(c.values[ym])}</div><button class="chip ${s}" data-a="cyc" data-n="${esc(n)}">${SL[s]}</button></div>`}).join('')+`</div>`});
 return h+(cnt?'':`<div class="card">Brak wpisów w tym miesiącu. Użyj przycisku „＋ Wpis”.</div>`)}
function anal(){
 const now=nowYM(),cy=+now.slice(0,4),[a,b,k]=per(yr),L=cats(),ytd=totS(a),py=totS(b);
 let h=`<div class="mn"><button class="btn g" data-a="yr" data-d="-1">‹</button><b style="font-size:18px">${yr}</b><button class="btn g" data-a="yr" data-d="1">›</button></div>`,fc='';
 if(yr===cy&&k<12){const rem=rng(yr+'-'+pad(k+1),yr+'-12');
  fc=`<div class="row"><div class="n"><div>Prognoza roku — sezonowość</div><div class="mu">ile zapłacono w tych miesiącach rok temu</div></div><div class="num">${f0(ytd+totS(rem.map(m=>addM(m,-12))))}</div></div><div class="row"><div class="n"><div>Prognoza roku — średnia</div><div class="mu">średnia z 3 ostatnich pełnych miesięcy</div></div><div class="num">${f0(ytd+totS(rng(addM(now,-3),addM(now,-1)))/3*rem.length)}</div></div>`}
 h+=`<div class="card"><h2>Rok ${yr} · ${MNS[0]}–${MNS[k-1]}</h2><div class="big">${f0(ytd)}</div><div class="mu">rok temu (ten sam okres): ${f0(py)} ${dlt(ytd,py)} · średnio ${f0(ytd/k)}/mies.</div>${fc}</div>`;
 h+=`<div class="card"><h2>Wg grup</h2>${gtab(yr)}</div>`;
 const cr=L.map(([n,c])=>[n,c,sumR(c,a),sumR(c,b)]).filter(r=>r[2]||r[3]).sort((p,q)=>q[2]-p[2]).slice(0,20);
 h+=`<div class="card"><h2>Kategorie — top ${cr.length}</h2>${cr.map(([n,c,x,z])=>`<div class="row"><div class="n"><div><span class="dot" style="background:${gi(c.tag||'inne').color}"></span>${esc(n)}</div><div class="mu">rok temu ${f0(z)} ${dlt(x,z)}</div></div><div class="num">${f0(x)}</div></div>`).join('')}</div>`;
 if(yr===cy){const an=[];L.forEach(([n,c])=>{const x=v(c,now),H=rng(addM(now,-12),addM(now,-1)).map(m=>v(c,m)).filter(z=>z>0).sort((p,q)=>p-q);if(!x||H.length<3)return;const md=H[H.length>>1];if(x>md*1.3&&x-md>30)an.push([n,x,md])});an.sort((p,q)=>(q[1]-q[2])-(p[1]-p[2]));
  h+=`<div class="card"><h2>Wyższe niż zwykle · ${ml(now)}</h2>${an.slice(0,8).map(([n,x,md])=>`<div class="row"><div class="n"><div>${esc(n)}</div><div class="mu">mediana 12 mies.: ${f2(md)}</div></div><div class="num">${f2(x)} <span class="up">+${((x/md-1)*100).toFixed(0)}%</span></div></div>`).join('')||'<div class="mu">Brak odchyleń &gt;30% od mediany.</div>'}</div>`}
 const ys=[...new Set(Object.values(S.categories).flatMap(c=>Object.keys(c.values||{}).map(m=>m.slice(0,4))))].sort();
 return h+`<div class="card"><h2>Sumy roczne</h2>${bars(ys.map(y=>({k:y,l:y.slice(2),v:totS(rng(y+'-01',y+'-12'))})),String(yr))}${S.settings.excl?`<div class="mu">Pominięto pojedyncze wpisy ≥ ${f0(lim())}</div>`:''}</div>`}
function data(){
 const fs=typeof showDirectoryPicker==='function';
 let h=`<div class="card"><h2>Zapis danych</h2><p>${dir?`Folder połączony — zmiany zapisują się automatycznie do <b>oplaty_stale.json</b>.`:dirty?'<span class="up">Są niezapisane zmiany w pliku.</span>':'Dane są w pamięci aplikacji. '+(lastSave?'Ostatni zapis pliku: '+lastSave:'Zrób kopię do pliku.')}</p><div class="fl" style="margin-top:12px"><button class="btn" data-a="exp">${dir?'Zapisz teraz':'Zapisz do Plików / iCloud'}</button><button class="btn g" data-a="${dir?'ldir':'load'}">Wczytaj ${dir?'z folderu':'plik'}</button>${fs?(dir?'<button class="btn g" data-a="ddir">Odłącz folder</button>':'<button class="btn g" data-a="cdir">Połącz folder (komputer)</button>'):''}</div><p class="mu" style="margin-top:10px">iPhone: „Zapisz” otwiera arkusz udostępniania → Zapisz w Plikach → iCloud Drive. Wczytanie: Wczytaj plik → wybierz plik z iCloud. Komputer (Chrome/Edge): połącz folder, a zapis będzie automatyczny.</p></div>`;
 h+=`<div class="card"><h2>Analizy</h2><div class="row"><div class="n"><div>Pomijaj duże jednorazowe wpisy</div><div class="mu">np. fotowoltaika, pompa ciepła — zaburzają średnie</div></div><input type="checkbox" style="width:24px;height:24px" ${S.settings.excl?'checked':''} onchange="S.settings.excl=this.checked;save();render()"></div><label>Próg (zł)</label><input inputmode="numeric" value="${S.settings.thr||10000}" onchange="S.settings.thr=+this.value||10000;save();render()"></div>`;
 h+=`<div class="card"><h2>Kategorie — grupa i widoczność</h2>`+Object.entries(S.categories).sort((p,q)=>p[0].localeCompare(q[0],'pl')).map(([n,c])=>`<div class="row"><div class="n"><div>${esc(n)}</div></div><select style="width:120px;padding:6px" data-n="${esc(n)}" onchange="S.categories[this.dataset.n].tag=this.value;save()">${Object.entries(groups()).map(([t,g])=>`<option value="${t}" ${(c.tag||'inne')===t?'selected':''}>${esc(g.label)}</option>`).join('')}</select><button class="chip ${c.hidden?'':'paid'}" data-a="hide" data-n="${esc(n)}">${c.hidden?'ukryta':'widoczna'}</button></div>`).join('')+`</div>`;
 return h+`<div class="card"><h2>Instalacja na iPhone</h2><p class="mu">Safari → Udostępnij → Dodaj do ekranu początkowego. Aplikacja działa offline.</p></div>`}
/* ── wpis ── */
function openEntry(n,m){
 m=m||ym;const names=Object.keys(S.categories),tags=[...new Set([...Object.keys(groups()),...Object.values(S.categories).map(c=>c.tag||'inne')])];
 const opts=tags.map(t=>{const l=names.filter(k=>(S.categories[k].tag||'inne')===t).sort((p,q)=>p.localeCompare(q,'pl'));return l.length?`<optgroup label="${esc(gi(t).label)}">${l.map(k=>`<option ${k===n?'selected':''}>${esc(k)}</option>`).join('')}</optgroup>`:''}).join('');
 $('#sheet').innerHTML=`<div class="ov" data-a="close"><div class="sh"><h3 style="font-size:18px">${n&&S.categories[n]?.values?.[m]!=null?'Edytuj wpis':'Nowy wpis'}</h3><p class="mu">Wpisz kwotę opłaty za wybrany miesiąc. Istniejący wpis zostanie nadpisany.</p>
 <label>1 · Czego dotyczy opłata?</label><select id="ec" onchange="pre()">${opts}<option value="__new">＋ Nowa kategoria…</option></select>
 <div id="nw" hidden><label>Nazwa nowej kategorii</label><input id="en"><label>Grupa</label><select id="eg">${tags.map(t=>`<option value="${t}">${esc(gi(t).label)}</option>`).join('')}</select></div>
 <label>2 · Za który miesiąc?</label><input type="month" id="em" value="${m}" onchange="pre()">
 <label>3 · Kwota (zł)</label><input id="ea" inputmode="decimal" placeholder="0,00"><div class="mu" id="eh"></div>
 <label>4 · Status</label><select id="es">${Object.entries(SL).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select>
 <label>Notatka (opcjonalnie)</label><input id="eo">
 <div class="fl" style="margin-top:16px"><button class="btn g" data-a="close2">Anuluj</button>${n&&S.categories[n]?.values?.[m]!=null?'<button class="btn g up" data-a="del">Usuń</button>':''}<button class="btn" style="flex:2" data-a="saveE">Zapisz</button></div></div></div>`;
 if(n)$('#ec').value=n;else if(!names.length)$('#ec').value='__new';pre(true)}
function pre(first){
 const sel=$('#ec').value,isN=sel==='__new';$('#nw').hidden=!isN;const c=S.categories[sel],m=$('#em').value;
 const prevs=c?Object.keys(c.values||{}).filter(k=>k<m&&c.values[k]!=null).sort():[],last=prevs.length?c.values[prevs[prevs.length-1]]:null;
 const cv=c?.values?.[m];$('#ea').value=cv!=null?cv:(last!=null?last:(c?.defaultAmount||''));
 $('#eh').textContent=c&&last!=null&&cv==null?`Podpowiedź: ostatnia kwota ${f2(last)} (${prevs[prevs.length-1]}) — popraw, jeśli inna.`:'';
 $('#es').value=c?.statuses?.[m]||(m<nowYM()?'paid':'unpaid');$('#eo').value=c?.notes?.[m]||''}
function saveE(){
 let n=$('#ec').value;const isN=n==='__new';if(isN){n=$('#en').value.trim();if(!n)return toast('Podaj nazwę kategorii')}
 const m=$('#em').value,a=parseFloat($('#ea').value.replace(/\s/g,'').replace(',','.'));if(!m||isNaN(a))return toast('Podaj miesiąc i kwotę');
 const c=S.categories[n]=S.categories[n]||{tag:isN?$('#eg').value:'inne',description:'',color:'',hidden:false,defaultAmount:0};
 c.values=c.values||{};c.statuses=c.statuses||{};c.notes=c.notes||{};
 c.values[m]=Math.round(a*100)/100;c.statuses[m]=$('#es').value;const o=$('#eo').value.trim();o?c.notes[m]=o:delete c.notes[m];
 ym=m;if(tab==='home'||tab==='data')tab='month';$('#sheet').innerHTML='';save();render();toast('Zapisano ✓')}
/* ── akcje ── */
const A={
 tab:d=>{tab=d.t;render();scrollTo(0,0)},mv:d=>{ym=addM(ym,+d.d);render()},yr:d=>{yr+=+d.d;render()},new:()=>openEntry(),
 edit:d=>openEntry(d.n,d.m),close:()=>$('#sheet').innerHTML='',close2:()=>$('#sheet').innerHTML='',saveE,
 cyc:d=>{const c=S.categories[d.n];c.statuses=c.statuses||{};c.statuses[ym]={na:'unpaid',unpaid:'paid',paid:'partial',partial:'na'}[c.statuses[ym]||'na'];save();render()},
 del:()=>{const c=S.categories[$('#ec').value],m=$('#em').value;if(c&&confirm('Usunąć ten wpis?')){delete c.values[m];delete c.statuses?.[m];delete c.notes?.[m];$('#sheet').innerHTML='';save();render()}},
 hide:d=>{const c=S.categories[d.n];c.hidden=!c.hidden;save();render()},
 exp:exportFile,load:loadFile,ldir:loadDir,cdir:connectDir,ddir:dropDir};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.dataset.a==='close'&&e.target!==b)return;A[b.dataset.a]?.(b.dataset)});
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2600)}
function hdr(){const b=$('#sv');if(!b||!S)return;const hh=S.activeHousehold&&S.households?.[S.activeHousehold];$('#sub').textContent=hh?hh.name:'Opłaty stałe';
 b.className='chip '+(dir||!dirty?'paid':'unpaid');b.textContent=dir?'✓ folder':dirty?'● niezapisane':lastSave?'✓ '+lastSave.slice(-8,-3):'Dane'}
function render(){$('#app').innerHTML={home,month,an:anal,data}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#ttl').textContent={home:'Start',month:'Miesiąc',an:'Analizy',data:'Dane'}[tab];hdr()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script></body></html>
